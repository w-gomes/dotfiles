# Noctalia configuration — all settings at their defaults.
# Copy to ~/.config/noctalia/config.toml and edit what you need.
# Most changes are hot-reloaded via inotify; startup-only settings are noted inline.

# ── Shell ─────────────────────────────────────────────────────────────────────

[shell]
corner_radius_scale  = 1.0
font_family           = "Hack Nerd Font Mono"
telemetry_enabled     = false
show_location         = true
clipboard_enabled     = false
clipboard_auto_paste  = "off"

[shell.animation]
enabled = false
speed   = 1.0

[shell.shadow]
direction = "down_right"
alpha = 0.55

[shell.panel]
borders = false
shadow  = true
launcher_position = "center"
open_near_click_control_center = true
transparency_mode = "glass"

[shell.launcher]
categories    = true
compact       = false
app_grid      = false
sort_by_usage = true
pinned        = []

[shell.launcher.providers.session]
prefix = ""
global = true

[shell.mpris]
blacklist = []

# ── Wallpaper ─────────────────────────────────────────────────────────────────

[wallpaper]
enabled                = false
fill_mode              = "crop"
fill_color              = "#000000"
transition              = ["fade", "wipe", "disc", "stripes", "honeycomb"]
transition_duration     = 1500
edge_smoothness         = 0.05
transition_on_startup   = true
directory                = "/home/tre/Pictures/Wallpapers"

[wallpaper.automation]
enabled           = false
interval_seconds  = 300
order             = "random"

# ── Theme ─────────────────────────────────────────────────────────────────────

[theme]
mode   = "dark"
source = "builtin"
builtin = "Kanagawa"

# ── Notifications ─────────────────────────────────────────────────────────────

[notification]
enable_daemon       = true
layer               = "overlay"
background_opacity  = 0.8
offset_x = 20
offset_y = 8

[audio]
enable_overdrive    = false
enable_sounds       = false
sound_volume        = 0.5
volume_change_sound = ""

# ── OSD ───────────────────────────────────────────────────────────────────────

[osd]
position            = "top_right"
background_opacity  = 1.0

# ── Lock Screen ───────────────────────────────────────────────────────────────

[lockscreen]
enabled = true
blur_intensity = 0.5
tint_intensity = 0.3
blurred_desktop = false

# ── Weather ───────────────────────────────────────────────────────────────────

[weather]
enabled = true
unit    = "celsius"
effects = true

[control_center.calendar]
show_events_card  = true
show_week_numbers = false

# ── Brightness ────────────────────────────────────────────────────────────────

[brightness]
enable_ddcutil = false

# ── Night Light ───────────────────────────────────────────────────────────────

[nightlight]
enabled            = false
force              = false
temperature_day    = 6500
temperature_night  = 4000

# ── Location ──────────────────────────────────────────────────────────────────

[location]
auto_locate = false
address     = "Rio de Janeiro, RJ"

# ── Idle ──────────────────────────────────────────────────────────────────────

[idle.behavior.lock]
timeout = 7200
action  = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 900
action  = "screen_off"
enabled = true

# ── Keybinds ──────────────────────────────────────────────────────────────────

[keybinds]
validate = ["return", "enter"]
cancel   = ["escape"]
left     = ["left"]
right    = ["right"]
up       = ["up"]
down     = ["down"]
delete   = ["del"]

# ── Bar ───────────────────────────────────────────────────────────────────────

[bar.main]
position            = "top"
background_opacity  = 0.93
radius              = 12
padding             = 2
widget_spacing      = 6
font_scale          = 1.0
shadow              = true
auto_hide           = false
capsule             = false

start  = ["workspaces", "media"]
center = ["clock"]
end    = ["sysmon", "battery", "network", "bluetooth", "tray", "notifications", "volume", "control-center"]

# ── Dock ──────────────────────────────────────────────────────────────────────

[dock]
enabled          = false
position         = "bottom"
background_opacity = 0.3
auto_hide        = true
launcher_position = "none"
pinned           = []

# ── Desktop Widgets ───────────────────────────────────────────────────────────

[desktop_widgets]
enabled = false
