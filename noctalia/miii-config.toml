[audio]
enable_overdrive = false
enable_sounds = false
sound_volume = 0.5
volume_change_sound = ""

[bar.main]
auto_hide = false
background_opacity = 0.39999999105930328
capsule = false
center = [ "clock" ]
concave_edge_corners = false
end = [ "sysmon", "battery", "network", "bluetooth", "tray", "notifications", "volume", "control-center" ]
font_scale = 1.0
margin_ends = 0
padding = 2
position = "top"
radius = 12
scale = 0.90000000596046448
shadow = true
start = [ "workspaces", "media" ]
thickness = 20
widget_spacing = 6

[brightness]
enable_ddcutil = false

[control_center.calendar]
show_events_card = true
show_week_numbers = false

[desktop_widgets]
enabled = false

[dock]
auto_hide = true
background_opacity = 0.29999999999999999
enabled = false
launcher_position = "none"
pinned = []
position = "bottom"

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 7200

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 900

[keybinds]
cancel = [ "escape" ]
delete = [ "del" ]
down = [ "down" ]
left = [ "left" ]
right = [ "right" ]
up = [ "up" ]
validate = [ "return", "enter" ]

[location]
address = "Rio de Janeiro, RJ"
auto_locate = false

[lockscreen]
blur_intensity = 0.5
blurred_desktop = false
enabled = true
tint_intensity = 0.29999999999999999

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
box_height = 196.0
box_width = 810.0
cx = 683.0
cy = 586.0
output = "eDP-1"
placement_height = 768.0
placement_width = 1366.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[nightlight]
enabled = false
force = false
temperature_day = 6500
temperature_night = 4000

[notification]
background_opacity = 0.80000000000000004
enable_daemon = true
layer = "overlay"
offset_x = 20
offset_y = 8

[osd]
background_opacity = 1.0
position = "top_right"

[shell]
clipboard_auto_paste = "off"
clipboard_enabled = false
corner_radius_scale = 1.0
font_family = "Hack Nerd Font Mono"
panel_anchor_bar = "main"
show_location = true
telemetry_enabled = false

[shell.animation]
enabled = false
speed = 1.0

[shell.launcher]
app_grid = false
categories = true
compact = false
pinned = []
sort_by_usage = true

[shell.launcher.providers.session]
global = true
prefix = ""

[shell.mpris]
blacklist = []

[shell.panel]
borders = false
launcher_position = "center"
open_near_click_control_center = true
shadow = true
transparency_mode = "glass"

[[shell.session.actions]]
action = "lock"
countdown_seconds = 0.0
enabled = true
shortcut = "1"
variant = "default"

[[shell.session.actions]]
action = "logout"
countdown_seconds = 0.0
enabled = true
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
countdown_seconds = 0.0
enabled = false
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "reboot"
countdown_seconds = 0.0
enabled = true
shortcut = "4"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 0.0
enabled = true
shortcut = "5"
variant = "destructive"

[shell.shadow]
alpha = 0.55000000000000004
direction = "down_right"

[theme]
builtin = "Kanagawa"
community_palette = "Monochrome"
mode = "dark"
pure_black_dark = true
source = "community"
wallpaper_scheme = "m3-monochrome"

[wallpaper]
directory = "/home/tre/Pictures/Wallpapers"
edge_smoothness = 0.050000000000000003
enabled = false
fill_color = "#000000"
fill_mode = "crop"
transition = [ "fade", "wipe", "disc", "stripes", "honeycomb" ]
transition_duration = 1500
transition_on_startup = true

[wallpaper.automation]
enabled = false
interval_seconds = 300
order = "random"

[wallpaper.default]
path = "/nix/store/j3w895kic5qhg0vhp4l49p94n504jgb2-noctalia-5.0.0/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.last]
path = "/nix/store/j3w895kic5qhg0vhp4l49p94n504jgb2-noctalia-5.0.0/share/noctalia/assets/noctalia-wallpaper.png"

[weather]
effects = true
enabled = true
unit = "celsius"

[widget.clock]
format = "{:%H:%M:%S - %A, %d %B %Y}"

[widget.control-center]
glyph = "dots"
